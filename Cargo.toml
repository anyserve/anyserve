[workspace]
members = [
  "bench/load",
  "clients/python",
  "crates/anyserve-client",
  "crates/anyserve-cli",
  "crates/anyserve-core",
  "crates/anyserve-proto",
  "examples/rust",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/anyserve/anyserve"
version = "0.5.0"

[workspace.dependencies]
anyhow = "1.0.98"
async-stream = "0.3.6"
axum = "0.7.9"
bytes = { version = "1.10", features = ["serde"] }
clap = { version = "4.5.37", features = ["derive"] }
futures = "0.3.31"
fs2 = "0.4.3"
http = "1.3.1"
prost = "0.13.5"
pyo3 = { version = "0.29.0", features = ["abi3-py312", "extension-module"] }
reqwest = { version = "0.12.15", default-features = false, features = ["json"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
# The preview function uses SQLx's locked SQLite handle; upgrade these together.
sqlx = { version = "=0.8.6", default-features = false, features = ["sqlite", "runtime-tokio-rustls"] }
libsqlite3-sys = { version = "=0.30.1", default-features = false }
tokio = { version = "1.45.1", features = ["fs", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = { version = "0.1.17", features = ["net"] }
toml = "0.8.23"
tonic = { version = "0.12.3", features = ["transport", "tls", "tls-webpki-roots"] }
tonic-health = "0.12.3"
tonic-build = "0.12.3"
tower = "0.4.13"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter", "fmt"] }
uuid = { version = "1.16.0", features = ["v4"] }
