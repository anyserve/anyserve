# Multi-cluster edge inference testbed on one GPU host.
#
#   bench ──client──> center ──wan-near (RTT_NEAR)──> edge-near ─┐
#     │                     └──wan-far  (RTT_FAR) ──> edge-far  ─┤──lan──> vllm, policy
#     └───────────── lan (direct baseline, BENCH_RTT) ───────────┘
#
# Each wan link gets half its RTT on both ends, so long-poll dispatch and
# completion each pay one one-way delay, like a real cross-region link.
name: anyserve-edge

x-anyserve: &anyserve
  image: anyserve:edge-dev
  cap_add: [NET_ADMIN]
  entrypoint: ["/bench/netem-exec.sh"]
  volumes: ["./:/bench:ro"]
  restart: unless-stopped

x-tokens: &tokens
  ANYSERVE_CLIENT_TOKENS: ${CLIENT_TOKEN:-bench-client-token}
  ANYSERVE_WORKER_TOKENS: ${WORKER_TOKEN:-bench-worker-token}
  ANYSERVE_WORKER_TOKEN: ${WORKER_TOKEN:-bench-worker-token}

services:
  center:
    <<: *anyserve
    command: ["anyserve", "serve", "--config", "/bench/center.toml"]
    environment:
      <<: *tokens
      NETEM_RULES: "172.31.11.:${HALF_RTT_NEAR:-15} 172.31.12.:${HALF_RTT_FAR:-35}"
    networks:
      client: {ipv4_address: 172.31.30.10}
      wan-near: {ipv4_address: 172.31.11.10}
      wan-far: {ipv4_address: 172.31.12.10}

  edge-near:
    <<: *anyserve
    # One worker process per backend; SIGTERM is forwarded so workers drain.
    command: ["bash", "-c", "for c in /bench/edge-near-*.toml; do anyserve --endpoint http://172.31.11.10:50052 worker --config $$c & done; trap 'kill -TERM $$(jobs -p); wait' TERM INT; wait -n"]
    environment:
      <<: *tokens
      NETEM_RULES: "172.31.11.:${HALF_RTT_NEAR:-15}"
    networks: [wan-near, lan]
    depends_on: [center]

  edge-far:
    <<: *anyserve
    # One worker process per backend; SIGTERM is forwarded so workers drain.
    command: ["bash", "-c", "for c in /bench/edge-far-*.toml; do anyserve --endpoint http://172.31.12.10:50052 worker --config $$c & done; trap 'kill -TERM $$(jobs -p); wait' TERM INT; wait -n"]
    environment:
      <<: *tokens
      NETEM_RULES: "172.31.12.:${HALF_RTT_FAR:-35}"
    networks: [wan-far, lan]
    depends_on: [center]

  vllm:
    image: vllm/vllm-openai:v0.10.2
    command: ["--model", "${LLM_MODEL:-Qwen/Qwen2.5-1.5B-Instruct}", "--dtype", "half",
              "--max-model-len", "4096", "--gpu-memory-utilization", "${VLLM_GPU_UTIL:-0.7}"]
    environment:
      VLLM_USE_FLASHINFER_SAMPLER: "0"   # FlashInfer sampling kernels fail on sm_75 (T4)
    ipc: host
    volumes: ["hf-cache:/root/.cache/huggingface"]
    deploy:
      resources:
        reservations:
          devices: [{driver: nvidia, count: all, capabilities: [gpu]}]
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8000/health"]
      interval: 10s
      retries: 60
    networks:
      lan: {ipv4_address: 172.31.20.20}

  policy:
    image: vllm/vllm-openai:v0.10.2
    entrypoint: ["uvicorn", "--app-dir", "/bench", "policy_server:app", "--host", "0.0.0.0", "--port", "9000", "--workers", "2"]
    volumes: ["./:/bench:ro"]
    networks:
      lan: {ipv4_address: 172.31.20.30}

  # Text-to-image backend; GPU-heavy, so start it only when vLLM is stopped:
  #   docker compose stop vllm && docker compose --profile image up -d image
  image:
    image: vllm/vllm-openai:v0.10.2
    profiles: ["image"]
    entrypoint: ["bash", "-c", "pip install -q diffusers==0.35.1 && uvicorn --app-dir /bench image_server:app --host 0.0.0.0 --port 9100"]
    volumes: ["./:/bench:ro", "hf-cache:/root/.cache/huggingface"]
    deploy:
      resources:
        reservations:
          devices: [{driver: nvidia, count: all, capabilities: [gpu]}]
    networks:
      lan: {ipv4_address: 172.31.20.40}

  # Network namespace for the bench client; tc on its lan leg emulates calling
  # the edge backend directly across the WAN (no middleware) for baselines.
  bench-net:
    <<: *anyserve
    command: ["sleep", "infinity"]
    environment:
      NETEM_RULES: "172.31.20.:${BENCH_RTT:-0}"
    networks: [client, lan]

  bench:
    image: vllm/vllm-openai:v0.10.2
    entrypoint: ["sleep", "infinity"]
    network_mode: "service:bench-net"
    # `vllm bench` needs a visible GPU to start (it only tokenizes).
    deploy:
      resources:
        reservations:
          devices: [{driver: nvidia, count: all, capabilities: [gpu]}]
    volumes: ["./:/bench", "hf-cache:/root/.cache/huggingface"]
    depends_on: [bench-net]

networks:
  client: {ipam: {config: [{subnet: 172.31.30.0/24}]}}
  wan-near: {ipam: {config: [{subnet: 172.31.11.0/24}]}}
  wan-far: {ipam: {config: [{subnet: 172.31.12.0/24}]}}
  lan: {ipam: {config: [{subnet: 172.31.20.0/24}]}}

volumes:
  hf-cache:
    external: true
    name: anyserve-hf-cache
