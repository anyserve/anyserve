[server]
grpc_host = "0.0.0.0"
grpc_port = 50052
[runtime]
heartbeat_interval_ms = 5000
heartbeat_timeout_ms = 15000

[auth]
client_tokens_env = "ANYSERVE_CLIENT_TOKENS"
worker_tokens_env = "ANYSERVE_WORKER_TOKENS"

[console]
enabled = false

[openai]
enabled = true
listen = "0.0.0.0:8080"
models = ["Qwen/Qwen2.5-1.5B-Instruct"]
request_timeout_secs = 300

[openai.demand.required_attributes]
family = "llm"

# Prefer the near edge; spill to any edge after 50 ms in queue.
[openai.demand.preferred_attributes]
region = "near"

[openai.policy]
spillover_after_ms = 50
queue_timeout_ms = 120000

[invoke]
enabled = true
listen = "0.0.0.0:8090"
default_timeout_ms = 5000

[invoke.policy]
spillover_after_ms = 20
