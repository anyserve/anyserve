syntax = "proto3";
package anyserve.cluster.v1;

import "execution.proto";

service PeerMesh {
  rpc SyncDirectory(stream NodeDirectoryEvent) returns (stream NodeDirectoryEvent);
  rpc ForwardInvoke(stream ForwardInvokeRequest) returns (stream anyserve.v2.ExecutionEvent);
  rpc WatchRemote(WatchRemoteRequest) returns (stream anyserve.v2.ExecutionEvent);
}

message PoolSlotSummary {
  string namespace = 1;
  string interface = 2;
  string pool = 3;
  uint32 free_slots = 4;
  double min_load_score = 5;
  repeated string ready_worker_ids = 6;
  map<string, string> shared_attributes = 7;
  map<string, int64> max_free_capacity = 8;
}

message DirectorySnapshot {
  repeated PoolSlotSummary summaries = 1;
}

message ClaimWakeup {
  string namespace = 1;
  string interface = 2;
}

message NodeDirectoryEvent {
  string source_node_id = 1;
  string internal_grpc_addr = 2;
  uint64 seq = 3;
  oneof payload {
    DirectorySnapshot snapshot = 10;
    PoolSlotSummary slot_delta = 11;
    ClaimWakeup wakeup = 12;
  }
}

message ForwardInvokeRequest {
  oneof msg {
    ForwardInvokeStart start = 1;
    anyserve.v2.InputChunk input = 2;
    anyserve.v2.InputEnd input_end = 3;
  }
}

message ForwardInvokeStart {
  string namespace = 1;
  anyserve.v2.InvokeStart invoke = 2;
  uint32 hop_count = 3;
}

message WatchRemoteRequest {
  string namespace = 1;
  string job_id = 2;
  uint64 after_sequence = 3;
}
