<svg xmlns="http://www.w3.org/2000/svg" width="900" height="680" viewBox="0 0 900 680" role="img" aria-labelledby="title desc">
  <title id="title">Anyserve 0.5 execution architecture</title>
  <desc id="desc">Client SDK, HTTP/OpenAI and console adapters share one in-memory Runtime. An optional SQLite journal stores durable recovery snapshots. Workers initiate outbound control and data connections, and invoke their own inference backends.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 Z" fill="#475569"/></marker>
  </defs>
  <rect width="900" height="680" rx="12" fill="#fff"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#172033">
    <text x="36" y="36" font-size="25" font-weight="700">Anyserve 0.5</text>
    <text x="36" y="61" font-size="15" fill="#475569">One execution owner. Outbound workers across hosts and clusters.</text>
    <g fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5">
      <rect x="36" y="88" width="236" height="58" rx="8"/>
      <rect x="330" y="88" width="236" height="58" rx="8"/>
      <rect x="624" y="88" width="236" height="58" rx="8"/>
    </g>
    <g font-size="16" font-weight="700" text-anchor="middle">
      <text x="154" y="123">Rust / Python SDK</text>
      <text x="448" y="123">HTTP / OpenAI</text>
      <text x="742" y="123">Console API</text>
    </g>
    <rect x="36" y="178" width="824" height="272" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="1.5" stroke-dasharray="7 5"/>
    <text x="54" y="202" font-size="12" font-weight="700" letter-spacing="1" fill="#475569">ONE CONTROL-PLANE PROCESS</text>
    <path d="M154 146 V164 H742 V146" fill="none" stroke="#475569" stroke-width="1.5"/>
    <path d="M448 146 V232" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
    <rect x="78" y="234" width="486" height="128" rx="9" fill="#eaf2ff" stroke="#2563eb" stroke-width="1.5"/>
    <g text-anchor="middle">
      <text x="321" y="266" font-size="21" font-weight="700">Execution Runtime</text>
      <text x="321" y="294" font-size="15">Admission · placement · attempts · deadlines</text>
      <text x="321" y="318" font-size="15">Reservations · cancellation · bounded event logs</text>
      <text x="321" y="342" font-size="13" fill="#475569">In-memory state machine shared by all ingress</text>
    </g>
    <rect x="634" y="250" width="186" height="104" rx="9" fill="#fff7e6" stroke="#a16207" stroke-width="1.5"/>
    <g text-anchor="middle">
      <text x="727" y="279" font-size="17" font-weight="700">Optional SQLite</text>
      <text x="727" y="303" font-size="14">Bounded writer · WAL</text>
      <text x="727" y="326" font-size="14">Recovery snapshots</text>
    </g>
    <path d="M570 301 H628" fill="none" stroke="#475569" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <g fill="none" stroke="#475569" stroke-width="1.5">
      <path d="M194 362 V387"/>
      <path d="M435 362 V387"/>
    </g>
    <g fill="#fff" stroke="#64748b" stroke-width="1.5">
      <rect x="102" y="388" width="185" height="44" rx="6"/>
      <rect x="343" y="388" width="185" height="44" rx="6"/>
    </g>
    <g font-size="15" font-weight="700" text-anchor="middle">
      <text x="194" y="415">Session: control</text>
      <text x="435" y="415">Attempt: data</text>
    </g>
    <text x="634" y="393" font-size="13" fill="#475569">Durable inputs / results</text>
    <text x="634" y="415" font-size="13" fill="#475569">No live frame history</text>
    <rect x="36" y="482" width="824" height="158" rx="10" fill="#f0fdf8" stroke="#15803d" stroke-width="1.5" stroke-dasharray="7 5"/>
    <text x="54" y="626" font-size="12" font-weight="700" letter-spacing="0.6" fill="#166534">WORKER HOSTS / CLUSTERS — CONNECTIONS INITIATED BY WORKERS</text>
    <g fill="none" stroke="#475569" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)">
      <path d="M194 438 V532"/>
      <path d="M435 438 V532"/>
    </g>
    <rect x="78" y="538" width="450" height="70" rx="8" fill="#fff" stroke="#15803d" stroke-width="1.5"/>
    <rect x="634" y="538" width="186" height="70" rx="8" fill="#fff" stroke="#15803d" stroke-width="1.5"/>
    <g text-anchor="middle">
      <text x="303" y="566" font-size="17" font-weight="700">Outbound worker</text>
      <text x="303" y="590" font-size="14">Rust / Python SDK or built-in HTTP worker</text>
      <text x="727" y="566" font-size="17" font-weight="700">Inference backend</text>
      <text x="727" y="590" font-size="14">Models / engine</text>
    </g>
    <path d="M534 573 H628" fill="none" stroke="#475569" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <text x="581" y="559" font-size="12" text-anchor="middle" fill="#475569">Local / HTTP</text>
    <text x="36" y="665" font-size="13" fill="#475569">Scaling workers adds backend capacity. One process owns job state and the journal.</text>
  </g>
</svg>
