services:
  anyserve:
    image: ${ANYSERVE_IMAGE:-ghcr.io/anyserve/anyserve:v0.5.0}
    # Uncomment to build locally from a source checkout (embeds the Console UI):
    # build: ../..
    restart: unless-stopped
    command: ["serve", "--config", "/etc/anyserve/server.toml"]
    environment:
      - ANYSERVE_CLIENT_TOKENS=${ANYSERVE_CLIENT_TOKENS:-}
      - ANYSERVE_WORKER_TOKENS=${ANYSERVE_WORKER_TOKENS:-}
      - ANYSERVE_SCOPED_TOKENS=${ANYSERVE_SCOPED_TOKENS:-}
      - ANYSERVE_PUBLIC_ENDPOINT
      - ANYSERVE_CONSOLE_AUTH_PORTAL_URL=${ANYSERVE_CONSOLE_AUTH_PORTAL_URL:-}
      - ANYSERVE_MEMORY_LIMIT_MB=${ANYSERVE_MEMORY_LIMIT_MB:-1024}
      - ANYSERVE_TOKEN_SIGNING_KEY=${ANYSERVE_TOKEN_SIGNING_KEY:-}
      - ANYSERVE_AUTH_REVOCATION_URL=${ANYSERVE_AUTH_REVOCATION_URL:-}
    healthcheck:
      test: ["CMD", "anyserve", "doctor", "--endpoint", "http://127.0.0.1:3001"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    volumes:
      - anyserve_data:/data
      - ./server.toml:/etc/anyserve/server.toml:ro

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - anyserve
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      - ANYSERVE_DOMAIN
    volumes:
      - ${ANYSERVE_CADDYFILE:-./Caddyfile}:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  # Optional GitHub Login self-service token plugin:
  #   ANYSERVE_CADDYFILE=./Caddyfile.auth-github docker compose --profile auth-github up -d
  auth-github:
    profiles: ["auth-github"]
    image: ${ANYSERVE_AUTH_GITHUB_IMAGE:-ghcr.io/anyserve/anyserve-auth-github:main}
    build:
      context: ../..
      dockerfile: plugins/anyserve-auth-github/Dockerfile
    restart: unless-stopped
    environment:
      - ANYSERVE_AUTH_LISTEN=0.0.0.0:3002
      - ANYSERVE_AUTH_DB=/data/auth-github.sqlite
      - ANYSERVE_AUTH_PUBLIC_URL=${ANYSERVE_AUTH_PUBLIC_URL:-https://${ANYSERVE_DOMAIN}}
      - ANYSERVE_AUTH_CONSOLE_URL=${ANYSERVE_AUTH_CONSOLE_URL:-https://${ANYSERVE_DOMAIN}}
      - ANYSERVE_AUTH_GRPC_ENDPOINT=${ANYSERVE_AUTH_GRPC_ENDPOINT:-https://${ANYSERVE_DOMAIN}}
      - ANYSERVE_AUTH_WS_ENDPOINT=${ANYSERVE_AUTH_WS_ENDPOINT:-wss://${ANYSERVE_DOMAIN}}
      - ANYSERVE_TOKEN_SIGNING_KEY
      - GITHUB_CLIENT_ID
      - GITHUB_CLIENT_SECRET
      - ANYSERVE_AUTH_ALLOWED_USERS=${ANYSERVE_AUTH_ALLOWED_USERS:-}
      - ANYSERVE_AUTH_MIN_ACCOUNT_AGE_DAYS=${ANYSERVE_AUTH_MIN_ACCOUNT_AGE_DAYS:-0}
      - ANYSERVE_AUTH_TOKEN_TTL_DAYS=${ANYSERVE_AUTH_TOKEN_TTL_DAYS:-30}
      - ANYSERVE_AUTH_MAX_TOKENS_PER_USER=${ANYSERVE_AUTH_MAX_TOKENS_PER_USER:-20}
      # Optional zero-login ephemeral guest sandbox (default disabled):
      - ANYSERVE_AUTH_GUEST_ENABLED=${ANYSERVE_AUTH_GUEST_ENABLED:-false}
      - ANYSERVE_AUTH_GUEST_TTL_SECS=${ANYSERVE_AUTH_GUEST_TTL_SECS:-1800}
      - ANYSERVE_AUTH_GUEST_RATE_LIMIT_PER_IP=${ANYSERVE_AUTH_GUEST_RATE_LIMIT_PER_IP:-10}
      - ANYSERVE_AUTH_GUEST_RATE_LIMIT_GLOBAL=${ANYSERVE_AUTH_GUEST_RATE_LIMIT_GLOBAL:-30}
      - ANYSERVE_AUTH_GUEST_MAX_ACTIVE=${ANYSERVE_AUTH_GUEST_MAX_ACTIVE:-200}
      # auth-github is only reachable via Caddy on the internal bridge; trust Caddy's rightmost X-Forwarded-For hop.
      - ANYSERVE_AUTH_TRUST_PROXY=${ANYSERVE_AUTH_TRUST_PROXY:-true}
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/3002 && printf 'GET /healthz HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q ' 204 ' <&3"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    volumes:
      - anyserve_auth_data:/data

volumes:
  anyserve_data:
  anyserve_auth_data:
  caddy_data:
  caddy_config:
