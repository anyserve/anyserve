# Tuned for a single 2 GiB VPS behind Caddy automatic HTTPS.
[server]
grpc_enabled = true
grpc_host = "0.0.0.0"
grpc_port = 50052

[console]
enabled = true
listen = "0.0.0.0:3001"
# Set ANYSERVE_CONSOLE_AUTH_PORTAL_URL (or uncomment below) when using GitHub Login:
# auth_portal_url = "https://relay.example.com/tokens"

[auth]
# Leave *_env unset here so ANYSERVE_CLIENT_TOKENS / ANYSERVE_WORKER_TOKENS /
# ANYSERVE_TOKEN_SIGNING_KEY / ANYSERVE_SCOPED_TOKENS remain optional when using
# GitHub Login alone.

[journal]
enabled = true
backend = "sqlite"
path = "/data/journal.sqlite"
retention_secs = 86400
# SQLite database byte cap (hard PRAGMA max_page_count + size-based terminal purge):
max_bytes = 536870912

[runtime]
max_queue = 500
max_pending_jobs = 2000
max_terminal_jobs = 1000
# Pending/result/event byte budgets scale automatically from ANYSERVE_MEMORY_LIMIT_MB
# (default 1024 in docker-compose.yml). Uncomment to pin explicit byte limits instead:
# max_pending_bytes = 268435456
# max_result_bytes = 268435456
# max_event_bytes = 67108864
max_inline_object_bytes = 8388608
max_inline_total_bytes = 25165824

# Per-namespace quotas enforced for every tenant (Rust control plane only).
# `gh-*` tenants receive the full per-namespace quotas below.
[runtime.tenant_quotas]
max_sessions_per_namespace = 32
max_pending_jobs_per_namespace = 200
max_interfaces_per_namespace = 32

# Ephemeral `guest-*` sandboxes (when ANYSERVE_AUTH_GUEST_ENABLED=true on the
# auth plugin) are tightly capped both per namespace and in aggregate so
# anonymous traffic cannot amplify across sandboxes and crowd out `gh-*` tenants:
# - max_total_sessions = 400 / 4096 default max_sessions (~9.8%, <= 10% of global)
# - max_total_pending_jobs = 400 / 2000 max_pending_jobs (20% of global)
# One anonymous IP (10 sandboxes / 10m) is bounded to <= 40 sessions (<1%) and
# <= 100 pending jobs (5%), preserving >= 80% global capacity for `gh-*` tenants.
[[runtime.tenant_quotas.prefix_overrides]]
prefix = "guest-"
max_sessions_per_namespace = 4
max_pending_jobs_per_namespace = 10
max_interfaces_per_namespace = 4
max_total_sessions = 400
max_total_pending_jobs = 400
