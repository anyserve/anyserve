apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "anyserve.fullname" . }}
  labels:
    {{- include "anyserve.labels" . | nindent 4 }}
data:
  server.toml: |
    [server]
    grpc_host = "0.0.0.0"
    grpc_port = {{ .Values.service.grpcPort }}

    [console]
    listen = "0.0.0.0:{{ .Values.service.httpPort }}"
    {{- with .Values.console.publicEndpoint }}
    public_endpoint = {{ . | quote }}
    {{- end }}
    {{- with .Values.console.authPortalUrl }}
    auth_portal_url = {{ . | quote }}
    {{- end }}

    [journal]
    enabled = {{ .Values.journal.enabled }}
    backend = {{ .Values.journal.backend | quote }}
    {{- if eq .Values.journal.backend "postgres" }}
    url_env = "ANYSERVE_DATABASE_URL"
    schema = {{ .Values.journal.postgres.schema | quote }}
    lease_duration_ms = {{ .Values.journal.postgres.leaseDurationMs }}
    poll_interval_ms = {{ .Values.journal.postgres.pollIntervalMs }}
    max_connections = {{ .Values.journal.postgres.maxConnections }}
    {{- else }}
    path = "/data/journal.sqlite"
    {{- if .Values.journal.maxBytes }}
    max_bytes = {{ .Values.journal.maxBytes | int64 }}
    {{- end }}
    {{- end }}
    {{- if and (not .Values.auth.existingSecret) (or .Values.auth.clientTokens .Values.auth.workerTokens) }}

    [auth]
    {{- if .Values.auth.clientTokens }}
    client_tokens_env = "ANYSERVE_CLIENT_TOKENS"
    {{- end }}
    {{- if .Values.auth.workerTokens }}
    worker_tokens_env = "ANYSERVE_WORKER_TOKENS"
    {{- end }}
    {{- end }}
    {{- $runtimeScalars := dict }}
    {{- $tenantQuotas := dict }}
    {{- range $key, $value := (.Values.runtime | default dict) }}
      {{- if or (eq $key "tenantQuotas") (eq $key "tenant_quotas") }}
        {{- if kindIs "map" $value }}
          {{- range $qk, $qv := $value }}
            {{- if not (kindIs "invalid" $qv) }}
              {{- $_ := set $tenantQuotas $qk $qv }}
            {{- end }}
          {{- end }}
        {{- end }}
      {{- else if not (kindIs "map" $value) }}
        {{- $_ := set $runtimeScalars $key $value }}
      {{- end }}
    {{- end }}
    {{- if $runtimeScalars }}

    [runtime]
    {{- range $key, $value := $runtimeScalars }}
    {{ $key }} = {{ $value | toJson }}
    {{- end }}
    {{- end }}
    {{- if $tenantQuotas }}

    [runtime.tenant_quotas]
    {{- range $key, $value := $tenantQuotas }}
    {{ $key }} = {{ $value | toJson }}
    {{- end }}
    {{- end }}
