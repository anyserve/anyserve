apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "anyserve.fullname" . }}
  labels:
    {{- include "anyserve.labels" . | nindent 4 }}
data:
  server.toml: |
    [server]
    grpc_host = "0.0.0.0"
    grpc_port = {{ .Values.service.grpcPort }}

    [console]
    listen = "0.0.0.0:{{ .Values.service.httpPort }}"

    [journal]
    enabled = {{ .Values.journal.enabled }}
    backend = {{ .Values.journal.backend | quote }}
    {{- if eq .Values.journal.backend "postgres" }}
    url_env = "ANYSERVE_DATABASE_URL"
    schema = {{ .Values.journal.postgres.schema | quote }}
    lease_duration_ms = {{ .Values.journal.postgres.leaseDurationMs }}
    poll_interval_ms = {{ .Values.journal.postgres.pollIntervalMs }}
    max_connections = {{ .Values.journal.postgres.maxConnections }}
    {{- else }}
    path = "/data/journal.sqlite"
    {{- end }}
    {{- if include "anyserve.authEnabled" . }}

    [auth]
    client_tokens_env = "ANYSERVE_CLIENT_TOKENS"
    worker_tokens_env = "ANYSERVE_WORKER_TOKENS"
    {{- end }}
    {{- with .Values.runtime }}

    [runtime]
    {{- range $key, $value := . }}
    {{ $key }} = {{ $value | toJson }}
    {{- end }}
    {{- end }}
