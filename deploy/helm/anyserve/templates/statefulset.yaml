{{- $postgres := and .Values.journal.enabled (eq .Values.journal.backend "postgres") -}}
{{- $sqlite := and .Values.journal.enabled (eq .Values.journal.backend "sqlite") -}}
{{- if not (has .Values.journal.backend (list "sqlite" "postgres")) }}
{{- fail "journal.backend must be sqlite or postgres" }}
{{- end }}
{{- if or (lt (int .Values.replicaCount) 1) (and (gt (int .Values.replicaCount) 1) (not $postgres)) }}
{{- fail "replicaCount must be 1 unless journal.backend=postgres and journal.enabled=true" }}
{{- end }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "anyserve.fullname" . }}
  labels:
    {{- include "anyserve.labels" . | nindent 4 }}
    app.kubernetes.io/component: control-plane
spec:
  replicas: {{ .Values.replicaCount }}
  podManagementPolicy: {{ if $postgres }}Parallel{{ else }}OrderedReady{{ end }}
  serviceName: {{ include "anyserve.fullname" . }}
  selector:
    matchLabels:
      {{- include "anyserve.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: control-plane
  template:
    metadata:
      labels:
        {{- include "anyserve.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: control-plane
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: anyserve
          image: {{ include "anyserve.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["serve", "--config", "/etc/anyserve/server.toml"]
          ports:
            - name: grpc
              containerPort: {{ .Values.service.grpcPort }}
            - name: http
              containerPort: {{ .Values.service.httpPort }}
          {{- if $postgres }}
          env:
            - name: ANYSERVE_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ required "journal.postgres.existingSecret is required for PostgreSQL" .Values.journal.postgres.existingSecret | quote }}
                  key: {{ .Values.journal.postgres.secretKey | quote }}
          {{- end }}
          {{- if include "anyserve.authEnabled" . }}
          envFrom:
            - secretRef:
                name: {{ include "anyserve.secretName" . }}
          {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
          volumeMounts:
            - name: config
              mountPath: /etc/anyserve
              readOnly: true
            {{- if $sqlite }}
            - name: journal
              mountPath: /data
            {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "anyserve.fullname" . }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  {{- if $sqlite }}
  volumeClaimTemplates:
    - metadata:
        name: journal
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- with .Values.journal.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.journal.size }}
  {{- end }}
