{{- if and (not .Values.auth.existingSecret) (or .Values.auth.clientTokens .Values.auth.workerTokens) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "anyserve.secretName" . }}
  labels:
    {{- include "anyserve.labels" . | nindent 4 }}
type: Opaque
stringData:
  ANYSERVE_CLIENT_TOKENS: {{ join "," .Values.auth.clientTokens | quote }}
  ANYSERVE_WORKER_TOKENS: {{ join "," .Values.auth.workerTokens | quote }}
  ANYSERVE_WORKER_TOKEN: {{ first .Values.auth.workerTokens | default "" | quote }}
{{- end }}
