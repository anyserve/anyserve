image:
  repository: ghcr.io/anyserve/anyserve
  # Defaults to the chart's appVersion.
  tag: ""
  pullPolicy: IfNotPresent

# Bearer tokens for the two roles. With both lists empty the control plane
# accepts any caller; do that only on a trusted network. Set existingSecret to
# a Secret that carries ANYSERVE_CLIENT_TOKENS and ANYSERVE_WORKER_TOKENS
# (comma-separated) and ANYSERVE_WORKER_TOKEN (the token the worker fleet
# uses) instead of putting tokens in values.
auth:
  clientTokens: []
  workerTokens: []
  existingSecret: ""

# PostgreSQL supports multiple active control-plane replicas. SQLite requires 1.
replicaCount: 1

# SQLite uses a PersistentVolumeClaim; PostgreSQL uses an external database.
# Disabling the journal keeps
# execution in memory: durable Submit is rejected and nothing survives restart.
journal:
  enabled: true
  backend: sqlite
  size: 1Gi
  storageClass: ""
  postgres:
    # Existing Secret containing the connection URL. No database is installed.
    existingSecret: ""
    secretKey: ANYSERVE_DATABASE_URL
    schema: anyserve
    leaseDurationMs: 15000
    pollIntervalMs: 100
    maxConnections: 16

# Scalar [runtime] keys written into server.toml, for example
# max_attempts: 5 or consumer_stall_timeout_ms: 10000.
runtime: {}

service:
  type: ClusterIP
  grpcPort: 50052
  httpPort: 3001

resources: {}
nodeSelector: {}
tolerations: []
affinity: {}

# An optional application worker fleet. The image carries your handler and the
# anyserve SDK; the pod receives ANYSERVE_ENDPOINT and ANYSERVE_TOKEN, which the
# Python SDK reads when serve() is given no endpoint or token.
worker:
  enabled: false
  replicas: 1
  image: ""
  command: []
  args: []
  env: []
  resources: {}
  nodeSelector: {}
  tolerations: []
