# Optional reference configuration tuned for a 512 MiB Fly.io Machine.
# By default, fly.toml starts `anyserve serve` with CLI flags and Fly secrets
# (no custom image layer required). Bake this file into a custom image if you
# want explicit memory budgets or per-interface policies.
[server]
grpc_enabled = true
grpc_host = "0.0.0.0"
grpc_port = 50052

[console]
enabled = true
listen = "0.0.0.0:3001"

[auth]
client_tokens_env = "ANYSERVE_CLIENT_TOKENS"
worker_tokens_env = "ANYSERVE_WORKER_TOKENS"

[journal]
enabled = true
backend = "sqlite"
path = "/data/journal.sqlite"
retention_secs = 86400

[runtime]
max_queue = 250
max_pending_jobs = 1000
max_terminal_jobs = 500
max_pending_bytes = 67108864
max_result_bytes = 67108864
max_event_bytes = 33554432
max_inline_object_bytes = 8388608
max_inline_total_bytes = 25165824
