name: Python distributions

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Source ref to package
        type: string
        default: ""

permissions:
  contents: read

jobs:
  sdist:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/check-release-version.py
      - run: python -m pip install build twine
      - run: python -m build clients/python --sdist --outdir dist
      - run: python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: python-sdist
          path: dist/*
          if-no-files-found: error

  wheels:
    name: Wheel ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            args: --zig --compatibility manylinux_2_28
          - runner: macos-14
            target: aarch64-apple-darwin
            args: ""
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            args: ""
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            args: ""
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - name: Install protoc on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Install protoc on macOS
        if: runner.os == 'macOS'
        run: brew install protobuf
      - name: Install protoc on Windows
        if: runner.os == 'Windows'
        run: choco install protoc --no-progress -y
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: wheel-${{ matrix.target }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install 'maturin>=1.7,<2' twine
      - if: runner.os == 'Linux'
        run: python -m pip install ziglang
      - name: Build wheel
        shell: bash
        run: python -m maturin build --locked --release --manifest-path clients/python/Cargo.toml --target '${{ matrix.target }}' --interpreter python --out dist ${{ matrix.args }}
      - run: python -m twine check dist/*
      - name: Install and test wheel
        shell: bash
        run: |
          python -m pip install --no-index dist/*.whl
          python -m unittest discover -s clients/python/tests -p 'test_*.py'
      - uses: actions/upload-artifact@v4
        with:
          name: python-wheel-${{ matrix.target }}
          path: dist/*.whl
          if-no-files-found: error

