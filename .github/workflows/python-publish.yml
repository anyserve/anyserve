# Keep this filename for the existing PyPI Trusted Publisher identity.
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to publish again; leave empty to check this ref without publishing.
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      ref: ${{ steps.version.outputs.ref }}
      publish: ${{ steps.version.outputs.publish }}
    env:
      REQUESTED_TAG: ${{ github.event.inputs.tag || (github.event_name == 'push' && github.ref_name) || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag && format('refs/tags/{0}', github.event.inputs.tag) || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate release versions
        id: version
        run: |
          version=$(python scripts/check-release-version.py)
          RELEASE_TAG="${REQUESTED_TAG:-v$version}"
          python scripts/check-release-version.py "$RELEASE_TAG"
          printf 'tag=%s\nref=%s\n' "$RELEASE_TAG" "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          if [[ -n "$REQUESTED_TAG" ]]; then
            echo 'publish=true' >> "$GITHUB_OUTPUT"
          else
            echo 'publish=false' >> "$GITHUB_OUTPUT"
          fi

  ci:
    needs: validate
    uses: ./.github/workflows/anyserve-ci.yml
    with:
      ref: ${{ needs.validate.outputs.ref }}
      full: true

  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    needs: [validate, ci]
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            glibc: "2.28"
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            glibc: "2.28"
          - runner: macos-15
            target: aarch64-apple-darwin
            glibc: ""
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            glibc: ""
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            glibc: ""
    env:
      RELEASE_TAG: ${{ needs.validate.outputs.tag }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.ref }}

      - name: Install protoc on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Set up cargo-zigbuild on Linux (glibc 2.28 for Ubuntu 20.04/22.04/24.04, Jetson Orin, RK3588)
        if: runner.os == 'Linux'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install cargo-zigbuild
        if: runner.os == 'Linux'
        run: python -m pip install --upgrade cargo-zigbuild

      - name: Install protoc on macOS
        if: runner.os == 'macOS'
        run: brew install protobuf

      - name: Install protoc on Windows
        if: runner.os == 'Windows'
        run: choco install protoc --no-progress -y

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: rustfmt, clippy

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}-glibc-${{ matrix.glibc || 'native' }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: console/package-lock.json

      - name: Package release archive
        shell: bash
        env:
          CARGO_ZIGBUILD_GLIBC: ${{ matrix.glibc }}
        run: |
          chmod +x scripts/package-release.sh
          scripts/package-release.sh "${RELEASE_TAG}" "${{ matrix.target }}" dist

      - name: Smoke-test Linux archive on Ubuntu 22.04 (Jetson Orin / RK3588 compatibility)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          docker run --rm -v "${PWD}/dist:/dist:ro" ubuntu:22.04 bash -euo pipefail -c '
            mkdir -p /tmp/anyserve-smoke
            tar -xzf /dist/anyserve-*.tar.gz -C /tmp/anyserve-smoke
            bin=$(find /tmp/anyserve-smoke -maxdepth 2 -type f -name anyserve | head -n 1)
            test -x "$bin"
            "$bin" --version
            "$bin" serve --no-grpc --ephemeral --console-listen 127.0.0.1:3001 --auto-token >/tmp/serve.log 2>&1 &
            pid=$!
            trap "kill -TERM $pid 2>/dev/null || true; wait $pid 2>/dev/null || true" EXIT
            ready=0
            for _ in $(seq 1 50); do
              if exec 3<>/dev/tcp/127.0.0.1/3001 2>/dev/null; then
                printf "GET /readyz HTTP/1.1\r\nHost: 127.0.0.1\r\nConnection: close\r\n\r\n" >&3
                if grep -q " 204 " <&3; then
                  ready=1
                  break
                fi
              fi
              sleep 0.1
            done
            if [[ "$ready" != "1" ]]; then
              cat /tmp/serve.log >&2
              exit 1
            fi
            exec 4<>/dev/tcp/127.0.0.1/3001
            printf "GET / HTTP/1.1\r\nHost: 127.0.0.1\r\nConnection: close\r\n\r\n" >&4
            grep -q "<title>AnyServe Console</title>" <&4
            echo "Ubuntu 22.04 ($(uname -m)) smoke test passed."
          '

      - name: Upload packaged archive
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error

  image-build:
    name: Container image (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    needs: [validate, build, python]
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    env:
      RELEASE_TAG: ${{ needs.validate.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.ref }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/metadata-action@v5
        id: metadata
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ env.RELEASE_TAG }}
            type=semver,pattern={{version}},value=${{ env.RELEASE_TAG }}
            type=raw,value=latest,enable=${{ !contains(env.RELEASE_TAG, '-') }}

      - name: Resolve image repository
        id: repo
        env:
          REPO: ${{ github.repository }}
        run: echo "name=ghcr.io/${REPO,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        if: needs.validate.outputs.publish == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push platform image by digest
        id: push
        if: needs.validate.outputs.publish == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.metadata.outputs.labels }}
          outputs: type=image,name=${{ steps.repo.outputs.name }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=release-image-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=release-image-${{ matrix.arch }}

      - name: Export digest
        if: needs.validate.outputs.publish == 'true'
        run: |
          mkdir -p /tmp/digests
          printf '%s\n' "${{ steps.push.outputs.digest }}" > "/tmp/digests/${{ matrix.arch }}"

      - uses: actions/upload-artifact@v4
        if: needs.validate.outputs.publish == 'true'
        with:
          name: image-digest-${{ matrix.arch }}
          path: /tmp/digests/${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 1

      - name: Build and smoke-test image (dry-run)
        if: needs.validate.outputs.publish != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          load: true
          push: false
          tags: anyserve:release-check
          cache-from: type=gha,scope=release-image-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=release-image-${{ matrix.arch }}

      - name: Verify image binary (dry-run)
        if: needs.validate.outputs.publish != 'true'
        run: docker run --rm anyserve:release-check --version

  image:
    name: Publish multi-arch container manifest
    runs-on: ubuntu-24.04
    needs: [validate, image-build]
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    env:
      RELEASE_TAG: ${{ needs.validate.outputs.tag }}
    steps:
      - name: Merge amd64 and arm64 manifests
        if: needs.validate.outputs.publish != 'true'
        run: echo "Dry-run mode; skipping manifest push."

      - uses: actions/download-artifact@v4
        if: needs.validate.outputs.publish == 'true'
        with:
          pattern: image-digest-*
          path: /tmp/digests
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3
        if: needs.validate.outputs.publish == 'true'

      - uses: docker/metadata-action@v5
        id: metadata
        if: needs.validate.outputs.publish == 'true'
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ env.RELEASE_TAG }}
            type=semver,pattern={{version}},value=${{ env.RELEASE_TAG }}
            type=raw,value=latest,enable=${{ !contains(env.RELEASE_TAG, '-') }}

      - uses: docker/login-action@v3
        if: needs.validate.outputs.publish == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push multi-arch manifest list
        if: needs.validate.outputs.publish == 'true'
        env:
          REPO: ${{ github.repository }}
          TAGS: ${{ steps.metadata.outputs.tags }}
        run: |
          IMAGE_NAME="ghcr.io/${REPO,,}"
          AMD64_DIGEST="$(cat /tmp/digests/amd64)"
          ARM64_DIGEST="$(cat /tmp/digests/arm64)"
          tag_args=()
          while IFS= read -r tag; do
            if [[ -n "$tag" ]]; then
              tag_args+=(--tag "$tag")
            fi
          done <<< "${TAGS}"
          docker buildx imagetools create "${tag_args[@]}" \
            "${IMAGE_NAME}@${AMD64_DIGEST}" \
            "${IMAGE_NAME}@${ARM64_DIGEST}"
          docker buildx imagetools inspect "${IMAGE_NAME}:${RELEASE_TAG}"

  python:
    needs: [validate, ci]
    uses: ./.github/workflows/python-build.yml
    with:
      ref: ${{ needs.validate.outputs.ref }}

  pypi:
    name: Publish Python package
    needs: [validate, build, image, python]
    if: needs.validate.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: python-*
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

  publish:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs: [validate, build, image, pypi]
    if: needs.validate.outputs.publish == 'true'
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ needs.validate.outputs.tag }}
    steps:
      - name: Download packaged archives
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd dist
          sha256sum anyserve-*.tar.gz anyserve-*.zip > "anyserve-${RELEASE_TAG}-SHA256SUMS.txt"

      - name: Create or update GitHub release
        run: |
          VERSION="${RELEASE_TAG#v}"
          sed -e "s|__RELEASE_TAG__|${RELEASE_TAG}|g" -e "s|__VERSION__|${VERSION}|g" <<'EOF' > release-notes.md
          ## Install __RELEASE_TAG__

          **macOS & Linux (`x86_64` / `arm64`, glibc >= 2.28 — Ubuntu 20.04/22.04/24.04, Debian 11/12, Jetson Orin, RK3588)**
          ```bash
          curl -fsSL https://anyserve.github.io/anyserve/install.sh | sh -s -- --version __RELEASE_TAG__
          ```

          **Windows (PowerShell x86_64)**
          ```powershell
          $env:ANYSERVE_VERSION="__RELEASE_TAG__"; irm https://anyserve.github.io/anyserve/install.ps1 | iex
          ```

          **Python SDK (`manylinux_2_28` wheels for x86_64 & arm64)**
          ```bash
          pip install anyserve-runtime==__VERSION__
          ```

          **Docker (multi-arch `linux/amd64` + `linux/arm64`, embedded Console)**
          ```bash
          docker pull ghcr.io/anyserve/anyserve:__RELEASE_TAG__
          ```

          Docs: https://anyserve.github.io/anyserve/ · Live Demo: https://anyserve.arcosx.org
          EOF
          if gh release view "${RELEASE_TAG}" --repo "${GH_REPO}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" dist/* --repo "${GH_REPO}" --clobber
          else
            gh release create "${RELEASE_TAG}" dist/* --repo "${GH_REPO}" --title "${RELEASE_TAG}" --notes "$(cat release-notes.md)" --generate-notes
          fi
