# Keep this filename for the existing PyPI Trusted Publisher identity.
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to publish again; leave empty to check this ref without publishing.
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      ref: ${{ steps.version.outputs.ref }}
      publish: ${{ steps.version.outputs.publish }}
    env:
      REQUESTED_TAG: ${{ github.event.inputs.tag || (github.event_name == 'push' && github.ref_name) || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag && format('refs/tags/{0}', github.event.inputs.tag) || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate release versions
        id: version
        run: |
          version=$(python scripts/check-release-version.py)
          RELEASE_TAG="${REQUESTED_TAG:-v$version}"
          python scripts/check-release-version.py "$RELEASE_TAG"
          printf 'tag=%s\nref=%s\n' "$RELEASE_TAG" "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          if [[ -n "$REQUESTED_TAG" ]]; then
            echo 'publish=true' >> "$GITHUB_OUTPUT"
          else
            echo 'publish=false' >> "$GITHUB_OUTPUT"
          fi

  ci:
    needs: validate
    uses: ./.github/workflows/anyserve-ci.yml
    with:
      ref: ${{ needs.validate.outputs.ref }}

  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    needs: [validate, ci]
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: macos-14
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
    env:
      RELEASE_TAG: ${{ needs.validate.outputs.tag }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.ref }}

      - name: Install protoc on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Install protoc on macOS
        if: runner.os == 'macOS'
        run: brew install protobuf

      - name: Install protoc on Windows
        if: runner.os == 'Windows'
        run: choco install protoc --no-progress -y

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.99.1

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Package release archive
        shell: bash
        run: |
          chmod +x scripts/package-release.sh
          scripts/package-release.sh "${RELEASE_TAG}" "${{ matrix.target }}" dist

      - name: Upload packaged archive
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error

  image:
    name: Container image
    runs-on: ubuntu-latest
    needs: [validate, build, python]
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    env:
      RELEASE_TAG: ${{ needs.validate.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.ref }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/metadata-action@v5
        id: metadata
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ env.RELEASE_TAG }}
            type=semver,pattern={{version}},value=${{ env.RELEASE_TAG }}
            type=raw,value=latest,enable=${{ !contains(env.RELEASE_TAG, '-') }}
      - uses: docker/login-action@v3
        if: needs.validate.outputs.publish == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ needs.validate.outputs.publish == 'true' }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  python:
    needs: [validate, ci]
    uses: ./.github/workflows/python-build.yml
    with:
      ref: ${{ needs.validate.outputs.ref }}

  pypi:
    name: Publish Python package
    needs: [validate, build, image, python]
    if: needs.validate.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: python-*
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

  publish:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs: [validate, build, image, pypi]
    if: needs.validate.outputs.publish == 'true'
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ needs.validate.outputs.tag }}
    steps:
      - name: Download packaged archives
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd dist
          sha256sum anyserve-*.tar.gz anyserve-*.zip > "anyserve-${RELEASE_TAG}-SHA256SUMS.txt"

      - name: Create or update GitHub release
        run: |
          if gh release view "${RELEASE_TAG}" --repo "${GH_REPO}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" dist/* --repo "${GH_REPO}" --clobber
          else
            gh release create "${RELEASE_TAG}" dist/* --repo "${GH_REPO}" --title "${RELEASE_TAG}" --generate-notes
          fi
