name: Publish Python package

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build twine
      - run: python -m build clients/python --sdist --outdir dist
      - run: python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*

  wheel-macos-arm64:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - run: brew install protobuf
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install maturin twine
      - run: python -m maturin build --release --manifest-path clients/python/Cargo.toml --interpreter python --out dist
      - run: python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-macos-arm64
          path: dist/*

  publish:
    needs: [sdist, wheel-macos-arm64]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
