# Native execution and the optional management API.
[server]
grpc_host = "127.0.0.1"
grpc_port = 50052

[console]
listen = "127.0.0.1:3001"
allowed_origins = ["http://localhost:5173"]

[journal]
path = ".anyserve/journal.sqlite"

# Configure separate client and worker credentials for remote access.
# [auth]
# client_tokens_env = "ANYSERVE_CLIENT_TOKENS"
# worker_tokens_env = "ANYSERVE_WORKER_TOKENS"
